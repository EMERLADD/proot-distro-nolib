name: Build pdn

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch talloc source
        run: git submodule update --init --depth 1 vendor/samba
      - name: Install build tools and Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y make curl xz-utils bzip2 pkg-config
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK_PATH=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Build and package
        run: make package JOBS=2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and build Android AAR
        working-directory: android
        run: sh gradlew -PpdnEngineOnly=true :proot-engine:testDebugUnitTest :proot-engine:pdnCoverage :proot-engine:bundleDebugAar
      - name: Package and verify AAR
        run: |
          python3 -m unittest discover -s tests -p test_release_packaging.py -v
          python3 scripts/package-aar.py android/proot-engine/build/outputs/aar/proot-engine-debug.aar
      - name: Verify package checksums
        working-directory: build/packages
        run: sha256sum -c SHA256SUMS
      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: pdn-android-arm64-${{ github.sha }}
          path: |
            build/packages/*.tar.gz
            build/packages/*.so
            build/packages/*.aar
            build/packages/pdn
            build/packages/proot-loader
            build/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        run: |
          {
            echo '### Android ARM64 build'
            echo 'Binary dependency checks and release packaging passed.'
            echo 'Runtime tests require a compatible ARM64 Android host; they were not run on this Linux runner.'
            echo '```'
            cat build/packages/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: android-arm64
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pdn-android-arm64-${{ github.sha }}
          path: build/packages
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: sh scripts/publish-release.sh
